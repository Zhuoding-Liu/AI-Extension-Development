<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PageFlow AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <h1>PageFlow <em>AI</em></h1>
          <p id="siteName">Connecting to the current page…</p>
        </div>
        <button id="resetButton" class="icon-button" title="Reset this website" aria-label="Reset this website">↺</button>
      </header>

      <section class="ai-card" aria-labelledby="aiTitle">
        <div class="section-heading">
          <div><span class="spark">✦</span><h2 id="aiTitle">Describe your ideal page</h2></div>
          <span class="local-pill" id="aiMode">Local rules</span>
        </div>
        <div class="mode-switch" role="group" aria-label="AI page mode">
          <button class="active" type="button" data-ai-mode="adapt" aria-pressed="true"><b>Adapt</b><small>Adjust the existing page</small></button>
          <button type="button" data-ai-mode="rebuild" aria-pressed="false"><b>Rebuild preview</b><small>Create an isolated reading view</small></button>
          <button type="button" data-ai-mode="custom" aria-pressed="false"><b>AI Custom HTML</b><small>Generate a unique safe layout</small></button>
        </div>
        <div class="prompt-row">
          <textarea id="aiPrompt" rows="2" placeholder="For example: create a calm reading layout with a contents panel"></textarea>
          <button id="applyPrompt" class="send-button" aria-label="Apply smart settings">→</button>
        </div>
        <p class="hint" id="promptHint">Custom HTML uses a filtered content model, isolated preview, accessibility guards, and sanitized HTML/CSS.</p>
        <div id="aiPlan" class="ai-plan" hidden>
          <strong>Proposed design</strong>
          <p id="aiPlanSummary"></p>
          <ul id="aiPlanChanges"></ul>
          <div class="ai-plan-actions">
            <button id="dismissAi" type="button">Dismiss</button>
            <button id="applyAi" type="button">Apply changes</button>
          </div>
        </div>
        <button id="undoAi" class="undo-ai" type="button" hidden>Undo last AI change</button>
      </section>

      <section aria-labelledby="themeTitle">
        <div class="section-heading compact">
          <h2 id="themeTitle">Page appearance</h2>
        </div>
        <div class="theme-grid" role="group" aria-label="Page color theme">
          <button class="theme-button active" data-theme="original"><span class="theme-swatch original"></span><b>Original</b></button>
          <button class="theme-button" data-theme="warm"><span class="theme-swatch warm"></span><b>Warm</b></button>
          <button class="theme-button" data-theme="contrast"><span class="theme-swatch contrast"></span><b>Contrast</b></button>
        </div>
      </section>

      <section class="control-card" aria-labelledby="displayTitle">
        <div class="section-heading compact"><h2 id="displayTitle">Display &amp; reading</h2></div>
        <div class="switch-grid">
          <label class="switch-row"><span><i>▧</i><b>Hide images</b><small>Focus on text</small></span><input type="checkbox" data-key="hideImages" /><u></u></label>
          <label class="switch-row"><span><i>◐</i><b>Grayscale</b><small>Reduce distraction</small></span><input type="checkbox" data-key="grayscaleImages" /><u></u></label>
          <label class="switch-row"><span><i>Aa</i><b>Readable font</b><small>Use clearer type</small></span><input type="checkbox" data-key="readableFont" /><u></u></label>
          <label class="switch-row"><span><i>↗</i><b>Highlight links</b><small>Underline links</small></span><input type="checkbox" data-key="underlineLinks" /><u></u></label>
          <label class="switch-row"><span><i>◎</i><b>Reading focus</b><small>Dim side content</small></span><input type="checkbox" data-key="focusMode" /><u></u></label>
          <label class="switch-row"><span><i>≋</i><b>Reduce motion</b><small>Limit animation</small></span><input type="checkbox" data-key="reduceMotion" /><u></u></label>
        </div>
      </section>

      <section class="range-card" aria-label="Fine adjustments">
        <label class="range-row">
          <span><b>Text size</b><output data-output="fontScale">100%</output></span>
          <input type="range" data-key="fontScale" min="80" max="160" step="5" value="100" />
        </label>
        <label class="range-row">
          <span><b>Line spacing</b><output data-output="lineHeight">1.6</output></span>
          <input type="range" data-key="lineHeight" min="1.2" max="2.2" step="0.1" value="1.6" />
        </label>
        <label class="range-row">
          <span><b>Saturation</b><output data-output="saturation">100%</output></span>
          <input type="range" data-key="saturation" min="0" max="200" step="10" value="100" />
        </label>
        <label class="range-row">
          <span><b>Brightness</b><output data-output="brightness">100%</output></span>
          <input type="range" data-key="brightness" min="60" max="140" step="5" value="100" />
        </label>
        <label class="range-row">
          <span><b>Reading width</b><output data-output="readingWidth">Auto</output></span>
          <input type="range" data-key="readingWidth" min="0" max="1200" step="80" value="0" />
        </label>
      </section>

      <footer>
        <span id="status" role="status">Settings apply only to this website</span>
        <button id="openOptions">AI settings</button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
